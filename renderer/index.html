<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: file: blob:; font-src 'self'" />
  <title>MD Lezer</title>
  <link rel="stylesheet" href="../node_modules/@toast-ui/editor/dist/toastui-editor.css" />
  <link rel="stylesheet" href="../node_modules/@toast-ui/editor/dist/theme/toastui-editor-dark.css" />
  <link rel="stylesheet" href="../node_modules/@toast-ui/editor-plugin-code-syntax-highlight/dist/toastui-editor-plugin-code-syntax-highlight.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="light">
  <!-- Ambient backdrop: soft colour fields the glass panels blur over. -->
  <div class="scene" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
  </div>

  <div class="app">
    <header class="topbar" id="topbar">
      <div class="topbar-group topbar-left">
        <button class="icon-button" id="btn-sidebar" data-i18n-title="toolbar.recent" title="">
          <svg viewBox="0 0 20 20"><path d="M3.5 4.5h13M3.5 10h13M3.5 15.5h8" /></svg>
        </button>
        <div class="topbar-divider"></div>
        <button class="icon-button" id="btn-new" data-i18n-title="toolbar.new" title="">
          <svg viewBox="0 0 20 20"><path d="M11.5 2.5H6a1.5 1.5 0 0 0-1.5 1.5v12A1.5 1.5 0 0 0 6 17.5h8a1.5 1.5 0 0 0 1.5-1.5V6.5m-4-4 4 4m-4-4v4h4" /></svg>
        </button>
        <button class="icon-button" id="btn-open" data-i18n-title="toolbar.open" title="">
          <svg viewBox="0 0 20 20"><path d="M2.5 5.5A1.5 1.5 0 0 1 4 4h3.6l1.8 2H16a1.5 1.5 0 0 1 1.5 1.5v0M2.5 5.5v9A1.5 1.5 0 0 0 4 16h11.2a1.5 1.5 0 0 0 1.45-1.13l1.1-5A1.5 1.5 0 0 0 16.3 8H5.06a1.5 1.5 0 0 0-1.45 1.13L2.5 14.5v-9Z" /></svg>
        </button>
        <button class="icon-button" id="btn-save" data-i18n-title="toolbar.save" title="">
          <svg viewBox="0 0 20 20"><path d="M4 2.5h9.4L16.5 5.6V16A1.5 1.5 0 0 1 15 17.5H4A1.5 1.5 0 0 1 2.5 16V4A1.5 1.5 0 0 1 4 2.5Zm2 0v4h7v-4M5.5 17v-6h9v6" /></svg>
        </button>
      </div>

      <div class="topbar-group topbar-center">
        <div class="doc-title" id="doc-title">
          <span class="doc-name" id="doc-name">Naamloos</span>
          <span class="dirty-dot" id="dirty-dot" hidden></span>
        </div>
        <div class="segmented" id="mode-switch" role="tablist">
          <div class="segmented-thumb" id="segmented-thumb"></div>
          <button class="segmented-item" role="tab" data-mode="markdown" data-i18n="mode.markdown"></button>
          <button class="segmented-item" role="tab" data-mode="wysiwyg" data-i18n="mode.wysiwyg"></button>
        </div>
      </div>

      <div class="topbar-group topbar-right">
        <button class="icon-button" id="btn-theme" data-i18n-title="toolbar.theme" title="">
          <svg viewBox="0 0 20 20" class="theme-icon theme-icon-light"><circle cx="10" cy="10" r="4" /><path d="M10 1.5v2m0 13v2m8.5-8.5h-2m-13 0h-2m14.5-6-1.4 1.4M4.9 15.1l-1.4 1.4m13 0-1.4-1.4M4.9 4.9 3.5 3.5" /></svg>
          <svg viewBox="0 0 20 20" class="theme-icon theme-icon-dark"><path d="M16.5 12.2A7 7 0 0 1 7.8 3.5a7 7 0 1 0 8.7 8.7Z" /></svg>
          <svg viewBox="0 0 20 20" class="theme-icon theme-icon-auto"><circle cx="10" cy="10" r="6.5" /><path d="M10 3.5v13A6.5 6.5 0 0 0 10 3.5Z" fill="currentColor" stroke="none" /></svg>
        </button>
        <div class="overlay-spacer"></div>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar glass" id="sidebar" hidden>
        <div class="sidebar-header">
          <h2 data-i18n="sidebar.title"></h2>
          <button class="text-button" id="btn-clear-recent" data-i18n="sidebar.clear"></button>
        </div>
        <ul class="recent-list" id="recent-list"></ul>
        <p class="recent-empty" id="recent-empty" data-i18n="sidebar.empty" hidden></p>
      </aside>

      <main class="editor-shell glass">
        <div id="editor-root"></div>
      </main>
    </div>

    <footer class="statusbar">
      <span id="status-words"></span>
      <span class="status-sep"></span>
      <span id="status-chars"></span>
      <span class="status-sep"></span>
      <span id="status-reading"></span>
      <span class="status-spring"></span>
      <span id="status-saved" class="status-saved"></span>
    </footer>
  </div>

  <!-- Welcome overlay shown when no document is open yet. -->
  <div class="welcome" id="welcome" hidden>
    <div class="welcome-card glass">
      <div class="welcome-glyph">M↓</div>
      <h1 data-i18n="welcome.title"></h1>
      <p data-i18n="welcome.subtitle"></p>
      <div class="welcome-actions">
        <button class="pill-button pill-primary" id="btn-welcome-new" data-i18n="welcome.newFile"></button>
        <button class="pill-button" id="btn-welcome-open" data-i18n="welcome.openFile"></button>
      </div>
      <p class="welcome-hint" data-i18n="welcome.hint"></p>
    </div>
  </div>

  <div class="toast glass" id="toast" hidden></div>
  <div class="drop-indicator" id="drop-indicator" hidden></div>

  <script src="vendor/toastui-bundle.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
