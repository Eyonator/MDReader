<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'" />
  <title>Rendl</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      -webkit-app-region: no-drag;
      user-select: none;
    }
    .stage {
      height: 100%;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 18px;
    }
    .label {
      font-family: -apple-system, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #9aa3b0;
      text-align: center;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.35);
    }
    .mark {
      width: 110px;
      height: 110px;
      animation: spin 1.4s cubic-bezier(0.6, 0.1, 0.4, 0.9) infinite;
      filter: drop-shadow(0 12px 30px rgba(10, 132, 255, 0.45));
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .mark { animation: none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Rendl">
      <defs>
        <linearGradient id="g" x1=".1" y1=".9" x2=".9" y2=".1">
          <stop offset="0" stop-color="#0A84FF"/>
          <stop offset=".48" stop-color="#5AC8FA"/>
          <stop offset=".76" stop-color="#9E8CFF"/>
          <stop offset="1" stop-color="#ECEFF4"/>
        </linearGradient>
      </defs>
      <path d="M142 422V242c0-93 75-168 168-168h74" fill="none" stroke="url(#g)" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <p class="label" id="label" hidden></p>
  </div>
  <script src="splash.js"></script>
</body>
</html>
